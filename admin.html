<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O-unity Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>O-unity Admin</h1>
    <p><a href="index.html">&larr; Back to players</a></p>
  </header>
  <main>
    <form id="player-form" class="admin-form">
      <label>
        First name
        <input type="text" id="firstName" required>
      </label>
      <label>
        Last name
        <input type="text" id="lastName" required>
      </label>
      <label>
        Batting Skill (%): <span id="battingSkillValue">50</span>
        <input type="range" id="battingSkill" min="0" max="100" value="50">
      </label>
      <label>
        Bowling Skill (%): <span id="bowlingSkillValue">50</span>
        <input type="range" id="bowlingSkill" min="0" max="100" value="50" disabled>
      </label>
      <button type="submit">Add Player</button>
    </form>
    <p id="admin-status"></p>
  </main>
  <script src="auth.js"></script>
  <script>requireAdmin();</script>
  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
